worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65s;
    client_max_body_size 100m;

    client_body_temp_path /tmp/dsh-nginx-client-body;
    proxy_temp_path /tmp/dsh-nginx-proxy;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream harness {
        server 127.0.0.1:3080;
    }

    server {
        listen 8080;
        server_name _;
        auth_basic "DeepSeek Harness";
        auth_basic_user_file /run/dsh-auth/.htpasswd;

        location = /healthz {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            auth_basic off;
            proxy_pass http://harness;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:3080;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            proxy_intercept_errors off;
        }

        location / {
            proxy_pass http://harness;
            proxy_http_version 1.1;
            # Nginx is the authenticated network boundary. Normalize the
            # upstream authority for the Harness Host/Origin trust fence, keep
            # the original authority only as forwarding metadata, and never
            # pass the Basic credential into the application process.
            proxy_set_header Host 127.0.0.1:3080;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Origin "";
            proxy_set_header Authorization "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            send_timeout 24h;
            proxy_intercept_errors off;
        }
    }
}
